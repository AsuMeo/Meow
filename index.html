<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VK Client</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0e1621;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }
        .app {
            display: flex;
            height: 100vh;
        }

        /* Login screen */
        .login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: #17212b;
        }
        .login-screen h1 {
            font-size: 32px;
            margin-bottom: 10px;
            color: #fff;
        }
        .login-screen p {
            color: #7f91a4;
            margin-bottom: 30px;
        }
        .token-input {
            width: 90%;
            max-width: 400px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #242f3d;
            color: #fff;
            font-size: 14px;
            margin-bottom: 15px;
            word-break: break-all;
        }
        .token-input::placeholder { color: #5e6b7a; }
        .btn {
            padding: 15px 40px;
            border: none;
            border-radius: 10px;
            background: #2b5278;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: #3665a3; }
        .get-token-btn {
            background: #e94560;
            margin-bottom: 15px;
        }
        .get-token-btn:hover { background: #ff6b81; }

        /* Sidebar */
        .sidebar {
            width: 350px;
            background: #17212b;
            border-right: 1px solid #242f3d;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 15px;
            background: #17212b;
            border-bottom: 1px solid #242f3d;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }
        .user-name {
            font-weight: 600;
            font-size: 15px;
        }
        .user-status {
            font-size: 12px;
            color: #7f91a4;
        }
        .dialogs-list {
            flex: 1;
            overflow-y: auto;
        }
        .dialog {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid #242f3d;
        }
        .dialog:hover { background: #242f3d; }
        .dialog.active { background: #2b5278; }
        .dialog-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 12px;
            background: #242f3d;
        }
        .dialog-info {
            flex: 1;
            min-width: 0;
        }
        .dialog-name {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .dialog-preview {
            font-size: 13px;
            color: #7f91a4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .dialog-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
        }
        .unread-badge {
            background: #e94560;
            color: #fff;
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 10px;
            min-width: 18px;
            text-align: center;
        }

        /* Chat */
        .chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0e1621;
        }
        .chat-header {
            padding: 15px;
            background: #17212b;
            border-bottom: 1px solid #242f3d;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .chat-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
        }
        .chat-title {
            font-weight: 600;
            font-size: 16px;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .message {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .message.in {
            align-self: flex-start;
            background: #182533;
            border-bottom-left-radius: 4px;
        }
        .message.out {
            align-self: flex-end;
            background: #2b5278;
            border-bottom-right-radius: 4px;
        }
        .message-author {
            font-size: 12px;
            color: #e94560;
            margin-bottom: 4px;
            font-weight: 600;
        }
        .message-photo {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 5px;
        }
        .input-area {
            padding: 15px;
            background: #17212b;
            border-top: 1px solid #242f3d;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        .message-input {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 20px;
            background: #242f3d;
            color: #fff;
            font-size: 14px;
            resize: none;
            max-height: 100px;
        }
        .send-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 20px;
            background: #2b5278;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
        }
        .send-btn:hover { background: #3665a3; }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="app">
        <!-- Login -->
        <div class="login-screen" id="loginScreen">
            <h1>VK Client</h1>
            <p>Войдите через access token</p>
            <button class="btn get-token-btn" onclick="getToken()">Получить токен</button>
            <input type="text" class="token-input" id="tokenUrl" placeholder="Вставь ссылку с токеном сюда...">
            <button class="btn" onclick="login()">Войти</button>
        </div>

        <!-- Main App -->
        <div class="sidebar hidden" id="sidebar">
            <div class="sidebar-header">
                <img class="user-avatar" id="userAvatar" src="" alt="">
                <div>
                    <div class="user-name" id="userName"></div>
                    <div class="user-status" id="userStatus">онлайн</div>
                </div>
            </div>
            <div class="dialogs-list" id="dialogsList"></div>
        </div>

        <div class="chat hidden" id="chat">
            <div class="chat-header">
                <img class="chat-avatar" id="chatAvatar" src="" alt="">
                <div class="chat-title" id="chatTitle">Выберите диалог</div>
            </div>
            <div class="messages" id="messages"></div>
            <div class="input-area">
                <textarea class="message-input" id="msgInput" placeholder="Сообщение..." rows="1"></textarea>
                <button class="send-btn" onclick="sendMessage()">Отправить</button>
            </div>
        </div>
    </div>

    <script>
        let token = localStorage.getItem('vk_token');
        let currentPeer = null;
        let currentUser = null;

        const AUTH_URL = 'https://oauth.vk.com/authorize?client_id=2685278&scope=messages,audio,photos,video,docs,notes,pages,status,wall,groups,email,stats,notifications,offline&redirect_uri=https://oauth.vk.com/blank.html&display=page&response_type=token';

        function getToken() {
            window.open(AUTH_URL, '_blank');
        }

        async function login() {
            const url = document.getElementById('tokenUrl').value.trim();
            if (!url) return;

            const res = await fetch('/api/auth', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({url: url})
            });

            const data = await res.json();
            if (data.error) {
                alert(data.error);
                return;
            }

            token = data.token;
            currentUser = data.user;
            localStorage.setItem('vk_token', token);

            showApp();
            loadDialogs();
        }

        function showApp() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('sidebar').classList.remove('hidden');
            document.getElementById('chat').classList.remove('hidden');

            document.getElementById('userAvatar').src = currentUser.photo;
            document.getElementById('userName').textContent = currentUser.name;
            document.getElementById('userStatus').textContent = currentUser.online ? 'онлайн' : 'офлайн';
        }

        async function loadDialogs() {
            const res = await fetch('/api/dialogs', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({token: token})
            });

            const data = await res.json();
            const list = document.getElementById('dialogsList');
            list.innerHTML = '';

            data.dialogs.forEach(dialog => {
                const div = document.createElement('div');
                div.className = 'dialog';
                div.onclick = () => openDialog(dialog);
                div.innerHTML = `
                    <img class="dialog-avatar" src="${dialog.photo || 'https://vk.com/images/camera_100.png'}" alt="">
                    <div class="dialog-info">
                        <div class="dialog-name">${dialog.name}</div>
                        <div class="dialog-preview">${dialog.last_message}</div>
                    </div>
                    <div class="dialog-meta">
                        ${dialog.unread > 0 ? `<span class="unread-badge">${dialog.unread}</span>` : ''}
                    </div>
                `;
                list.appendChild(div);
            });
        }

        async function openDialog(dialog) {
            currentPeer = dialog.id;
            document.getElementById('chatTitle').textContent = dialog.name;
            document.getElementById('chatAvatar').src = dialog.photo || 'https://vk.com/images/camera_100.png';

            const res = await fetch('/api/messages', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({token: token, peer_id: currentPeer})
            });

            const data = await res.json();
            const container = document.getElementById('messages');
            container.innerHTML = '';

            data.messages.reverse().forEach(msg => {
                addMessage(msg);
            });

            container.scrollTop = container.scrollHeight;
        }

        function addMessage(msg) {
            const container = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'message ' + (msg.out ? 'out' : 'in');

            let html = '';
            if (!msg.out && msg.name) {
                html += `<div class="message-author">${msg.name}</div>`;
            }
            html += `<div>${msg.text || ''}</div>`;

            // Фото из вложений
            msg.attachments.forEach(att => {
                if (att.type === 'photo') {
                    const photo = att.photo.sizes.find(s => s.type === 'x') || att.photo.sizes[att.photo.sizes.length - 1];
                    html += `<img class="message-photo" src="${photo.url}" alt="">`;
                }
            });

            div.innerHTML = html;
            container.appendChild(div);
        }

        async function sendMessage() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text || !currentPeer) return;

            await fetch('/api/send', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({token: token, peer_id: currentPeer, text: text})
            });

            input.value = '';
            openDialog({id: currentPeer, name: document.getElementById('chatTitle').textContent, photo: document.getElementById('chatAvatar').src});
        }

        // Enter to send
        document.getElementById('msgInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Auto login
        if (token) {
            login();
        }
    </script>
</body>
</html>
